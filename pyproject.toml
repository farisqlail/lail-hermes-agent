[project]
name = "hermes"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "python-telegram-bot>=21",
  "openai>=1.40",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  # <2 is load-bearing: mcp 2.0 removed `mcp.server.fastmcp`, which ask_server
  # imports. An unpinned install resolves to 2.x and the app dies at import.
  "mcp>=1.0,<2",
  "httpx>=0.27",
  "edge-tts>=7.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
voice = ["faster-whisper>=1.2"]
# The native tray helper (python -m hermes.tray): always-on wake word + system
# tray icon. Kept separate from `voice` because it only makes sense on a desktop
# with a mic and a tray, not on a headless server.
desktop = ["openwakeword>=0.6", "sounddevice>=0.4", "pystray>=0.19", "Pillow>=10"]
# Video clipping (youtube_clip chat tool): yt-dlp downloads, imageio-ffmpeg
# bundles the ffmpeg binary so no system install is needed. Optional because the
# bundled ffmpeg is ~90 MB and only this one tool needs it.
media = ["yt-dlp>=2024.1", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  # starlette's TestClient warns about its httpx dependency; not actionable here
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.setuptools.packages.find]
include = ["hermes*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
