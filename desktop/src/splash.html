<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memulai Lail Hermes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%, #020617 100%);
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      -webkit-app-region: drag;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 30px;
    }
    .logo-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .glow-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3), inset 0 0 15px rgba(129, 140, 248, 0.3);
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
    .glow-ring-inner {
      position: absolute;
      width: 80%;
      height: 80%;
      border-radius: 50%;
      border: 2px dashed rgba(129, 140, 248, 0.6);
      animation: rotate-ring 8s infinite linear;
    }
    .logo-icon {
      width: 58px;
      height: 58px;
      z-index: 2;
      filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.6));
    }
    .title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1.5px;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .subtitle {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 24px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    .progress-bar-container {
      width: 240px;
      height: 4px;
      background: rgba(51, 65, 85, 0.6);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }
    .progress-bar-fill {
      position: absolute;
      width: 45%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #a855f7);
      border-radius: 4px;
      animation: progress-indet 1.6s infinite ease-in-out;
    }
    .status-text {
      font-size: 12px;
      color: #64748b;
      font-family: 'Consolas', 'Courier New', monospace;
      animation: fadeInOut 2s infinite ease-in-out;
    }
    @keyframes pulse-ring {
      0%, 100% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.08); opacity: 0.9; }
    }
    @keyframes rotate-ring {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes progress-indet {
      0% { left: -45%; width: 30%; }
      50% { width: 60%; }
      100% { left: 100%; width: 30%; }
    }
    @keyframes fadeInOut {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-wrapper">
      <div class="glow-ring"></div>
      <div class="glow-ring-inner"></div>
      <img class="logo-icon" src="../assets/icon.png" alt="Hermes Logo" />
    </div>
    <div class="title">LAIL HERMES</div>
    <div class="subtitle">Autonomous AI Workstation</div>
    
    <div class="progress-bar-container">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text" id="status-label">Menginisialisasi Lail Hermes Core & Server...</div>

  </div>

  <script>
    const statusMessages = [
      'Menghubungkan ke Hermes Engine...',
      'Memuat MCP Hub & Tool Registry...',
      'Menyiapkan Audio & Voice Interface...',
      'Memeriksa Model AI & Workspace...'
    ];
    let msgIdx = 0;
    setInterval(() => {
      msgIdx = (msgIdx + 1) % statusMessages.length;
      const el = document.getElementById('status-label');
      if (el) el.textContent = statusMessages[msgIdx];
    }, 2200);
  </script>
</body>
</html>
