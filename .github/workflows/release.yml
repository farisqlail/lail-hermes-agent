name: Build Windows Release

# Builds the installer on a clean GitHub-hosted runner. Never build the
# release locally: a compromised dev machine would bake infected binaries
# into the published .exe.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v0.0.2)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Next.js export lands in hermes/static, which the PyInstaller spec
      # bundles as data — so the web build has to run before PyInstaller.
      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Build backend engine
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller
          pyinstaller --noconfirm --distpath dist-backend --workpath build-backend hermes_engine.spec

      - name: Build Windows installer
        working-directory: desktop
        run: |
          npm ci
          npx electron-builder --win --publish never

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.exe --clobber
